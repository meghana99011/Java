<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 5px solid red;
            padding: 20px;
            margin: 100px;
        }
    </style>
</head>
<body>
    <from method="get">
        <label for="name">First name:</label>
        <input type="text" name="fname"><br><br>

        <label for="name">Last name:</label>
        <input type="text" name="lname"><br><br>

        <label for="email">Email:</label>
        <input type="text" name="email"><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female">
        <label for="female">Female</label>

        <label for="phone">Phone:</label>
        <input type="tel" name="phone" placeholder="Whatsapp Number"><br><br>

        <label for="city">City:</label>
        <input type="text" name="city"><br><br>

        <label for="lang">Languages Known</label>
        <input type="checkbox" name="languages" values="java">
        <label for="java">Java</label>
        <label for="lang">Languages Known</label>
        <input type="checkbox" name="languages" values="Python">
        <label for="python">Python</label>
        <label for="lang">Languages Known</label>
        <input type="checkbox" name="languages" values="javascript">
        <label for="javascript">Javascript</label>
        <button type="reset">Reset</button>
        <button type="submit">Login</button>


    </from>
    <div>Java</div>
    <div>Javascript</div>
    <script src="script.js"></script>
</body>
</html>
